<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfyaQueue - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --brand-green: #1E7A46;
            --brand-rust: #C1541A;
            --brand-navy: #16264A;
            --brand-bg: #FAFAF8;
            --brand-surface: #FFFFFF;
            --brand-text: #1B2333;
            --brand-text-muted: #55607A;
        }
        body { background: var(--brand-bg); min-height: 100vh; padding: 24px 16px; }
        .card { background: var(--brand-surface); border-radius: 16px; padding: 24px; width: 100%; max-width: 440px; margin: 0 auto; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .logo { width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, var(--brand-rust), #E06B2E); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .logo svg { width: 36px; height: 36px; }
        h1 { color: var(--brand-navy); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 20px; }
        
        .role-chips { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        .role-chip { padding: 10px 24px; border-radius: 24px; border: 2px solid #E0E4E8; background: var(--brand-surface); font-size: 14px; font-weight: 500; color: var(--brand-text-muted); cursor: pointer; transition: all 0.2s; }
        .role-chip.active { border-color: var(--brand-rust); background: #FFF4F0; color: var(--brand-rust); }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 500; color: var(--brand-text); margin-bottom: 6px; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #E0E4E8; border-radius: 10px; font-size: 16px; background: var(--brand-surface); transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { outline: none; border-color: var(--brand-rust); box-shadow: 0 0 0 3px rgba(193,84,26,0.1); }
        .btn { width: 100%; padding: 14px; background: var(--brand-rust); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; margin-top: 6px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #A84817; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <path d="M12 2v20M2 12h20"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </div>
        <h1>Create account</h1>
        
        <div class="role-chips">
            <div class="role-chip active" data-role="patient" onclick="selectRole(this)">Patient</div>
            <div class="role-chip" data-role="staff" onclick="selectRole(this)">Staff</div>
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" placeholder="John Doe" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password (6+ characters)</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" placeholder="+254 7XX XXX XXX" autocomplete="tel">
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
    </div>
    
    <script>
        let selectedRole = 'patient';
        function selectRole(el) {
            document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedRole = el.dataset.role;
        }
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!name || !email || password.length < 6) return alert('Fill all fields (password needs 6+ characters)');
            alert(`Registering ${name} as ${selectedRole}... (redirects to ${selectedRole === 'staff' ? 'Staff Home' : 'Home'})`);
        });
    </script>
</body>
</html>
