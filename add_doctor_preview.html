<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfyaQueue - Add Doctor / Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --brand-green: #1E7A46;
            --brand-rust: #C1541A;
            --brand-navy: #16264A;
            --brand-bg: #FAFAF8;
            --brand-surface: #FFFFFF;
            --brand-text: #1B2333;
            --brand-text-muted: #55607A;
        }
        body { background: var(--brand-bg); min-height: 100vh; padding: 20px 16px; }
        .card { background: var(--brand-surface); border-radius: 16px; padding: 24px; max-width: 480px; margin: 0 auto; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        
        .header { margin-bottom: 24px; }
        .header h1 { color: var(--brand-navy); font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .header p { color: var(--brand-text-muted); font-size: 14px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 500; color: var(--brand-text); margin-bottom: 8px; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #E0E4E8; border-radius: 10px; font-size: 16px; background: var(--brand-surface); transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { outline: none; border-color: var(--brand-green); box-shadow: 0 0 0 3px rgba(30,122,70,0.1); }
        
        .section-title { font-size: 15px; font-weight: 600; color: var(--brand-navy); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: var(--brand-green); border-radius: 2px; }
        
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .slot-chip { padding: 10px 16px; border-radius: 10px; border: 1px solid #E0E4E8; background: var(--brand-surface); font-size: 14px; color: var(--brand-text); cursor: pointer; transition: all 0.2s; }
        .slot-chip:hover { border-color: var(--brand-green); background: #F0F8F3; }
        .slot-chip.selected { border-color: var(--brand-green); background: var(--brand-green); color: white; }
        
        .btn-save { width: 100%; padding: 16px; background: var(--brand-green); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-save:hover { background: #18683C; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Add Doctor / Service</h1>
            <p>Enter details and select available time slots</p>
        </div>
        
        <form id="addDoctorForm">
            <div class="form-group">
                <label for="name">Doctor / Service name</label>
                <input type="text" id="name" placeholder="Dr. Sarah Otieno" required autocomplete="name">
            </div>
            
            <div class="form-group">
                <label for="specialty">Specialty</label>
                <input type="text" id="specialty" placeholder="General Practice" required autocomplete="off">
            </div>
            
            <div class="section-title">Time slots</div>
            <div class="chips" id="slotChips"></div>
            
            <button type="submit" class="btn-save" style="margin-top: 24px;">Save Doctor</button>
        </form>
    </div>

    <script>
        const defaultSlots = ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30"];
        const selectedSlots = new Set();
        
        function renderSlots() {
            document.getElementById('slotChips').innerHTML = defaultSlots.map(slot => 
                `<button type="button" class="slot-chip ${selectedSlots.has(slot) ? 'selected' : ''}" onclick="toggleSlot('${slot}')">${slot}</button>`
            ).join('');
        }
        
        function toggleSlot(slot) {
            if (selectedSlots.has(slot)) selectedSlots.delete(slot);
            else selectedSlots.add(slot);
            renderSlots();
        }
        
        document.getElementById('addDoctorForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const specialty = document.getElementById('specialty').value.trim();
            const slots = Array.from(selectedSlots).sort();
            
            if (!name || !specialty || slots.length === 0) {
                return alert('Fill in a name, specialty, and at least one time slot');
            }
            
            alert(`Doctor saved:\nName: ${name}\nSpecialty: ${specialty}\nSlots: ${slots.join(', ')}`);
        });
        
        renderSlots();
    </script>
</body>
</html>
